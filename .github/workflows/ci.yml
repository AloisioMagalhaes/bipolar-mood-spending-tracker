name: Quality, security and builds
on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Detect artifact-impacting changes
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            changed=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")
          else
            changed="force-build"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(lib/|web/|pubspec\.yaml$|pubspec\.lock$|\.github/workflows/(ci|pages)\.yml$)'; then
            echo "build_web=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_web=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Web artifact
        if: steps.scope.outputs.build_web == 'true'
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: |
            coverage/lcov.info
            build/web
          if-no-files-found: warn
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pubspec.lock
            --lockfile=android/gradle.lockfile
      - name: Scan repository for secrets
        uses: docker://zricethezav/gitleaks:latest
        with:
          args: detect --source . --no-banner --redact
  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - name: Validate SemVer tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must follow vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
      - run: flutter build web --release --base-href /bipolar-mood-spending-tracker/
      - run: flutter build apk --release
      - name: Package web and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf moodledger-web-${GITHUB_REF_NAME}.tar.gz -C build web
          gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/app-release.apk moodledger-web-${GITHUB_REF_NAME}.tar.gz --title "MoodLedger ${GITHUB_REF_NAME}" --generate-notes
