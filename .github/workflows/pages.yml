name: Deploy Flutter Web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - run: flutter build web --release --base-href /bipolar-mood-spending-tracker/
      - uses: actions/upload-pages-artifact@v3
        with: {path: build/web}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: npx --yes playwright@latest install --with-deps chromium
      - name: Verify deployed application shell
        env:
          PAGE_URL: https://aloisiomagalhaes.github.io/bipolar-mood-spending-tracker/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
          await page.goto(process.env.PAGE_URL, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForTimeout(5000);
          const title = await page.title();
          const bodyText = await page.locator('body').innerText();
          if (!title.includes('MoodLedger') || (!bodyText.includes('MoodLedger') && !bodyText.includes('Seu acompanhamento'))) {
            throw new Error(`Deployed page did not render expected content. title=${title} body=${bodyText.slice(0, 200)} errors=${errors.join(' | ')}`);
          }
          await browser.close();
          NODE
