name: Feature
description: Requisito rastreável do MoodLedger
title: "feat: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo e evidência
      description: Descreva o valor, requisito relacionado e referência.
    validations:
      required: true
  - type: textarea
    id: repository-impact
    attributes:
      label: Impacto no repositório e rastreabilidade
      description: Liste impacto em código, testes, Markdown, C4/UML, CI/CD, releases e deployments; justifique itens não aplicáveis.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceitação
    validations:
      required: true
